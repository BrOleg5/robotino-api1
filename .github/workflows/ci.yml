name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 gcc
            os: ubuntu-24.04
            cmake_args: -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc
          - name: Linux x86_64 clang
            os: ubuntu-24.04
            cmake_args: -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang
          - name: Linux arm64 gcc
            os: ubuntu-24.04-arm
            cmake_args: ""
          - name: Linux x86_64 gcc shared
            os: ubuntu-24.04
            cmake_args: -DBUILD_SHARED_LIBS=ON
          - name: Windows MSVC x64
            os: windows-2022
            cmake_args: -A x64
          - name: Windows MSVC x86
            os: windows-2022
            cmake_args: -A Win32
          - name: macOS arm64
            os: macos-14
            cmake_args: ""
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  python:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install .[test]
      - name: Test
        run: python -m pytest -v python/tests
